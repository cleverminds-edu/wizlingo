<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 62 62" fill="none">
  <defs>
    <!-- Bubble fill: hot pink top-right → vivid purple bottom-left -->
    <linearGradient id="wl-bubble" x1="33" y1="8" x2="15" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F43F88"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>

    <!-- Star inner radial glow -->
    <radialGradient id="wl-star-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFDE7" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#FFD700" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Soft drop-shadow for the bubble (scaled 80%, centered) -->
  <rect x="12" y="11" width="40" height="30" rx="10" fill="rgba(124,58,237,0.25)"/>

  <!-- Bubble body (scaled 80%, centered) -->
  <rect x="11" y="8" width="40" height="30" rx="10" fill="url(#wl-bubble)"/>

  <!-- Bubble tail (scaled 80%, centered) -->
  <path d="M 19,36 L 12,48 L 30,36 Z" fill="#7C3AED"/>

  <!-- Inner sparkle — glow halo (scaled 80%, centered) -->
  <ellipse cx="31" cy="23" rx="10.4" ry="10.4" fill="url(#wl-star-glow)"/>

  <!-- 4-pointed sparkle star (scaled 80%, centered at 31,23) -->
  <path d="M31,13 L33.6,19.2 L40,22 L33.6,24.8 L31,31 L28.4,24.8 L22,22 L28.4,19.2 Z" fill="#FFD700"/>

  <!-- Star inner bright highlight (scaled 80%) -->
  <path d="M31,16.8 L32.64,20 L35.6,21.6 L32.64,23.2 L31,26.4 L29.36,23.2 L26.4,21.6 L29.36,20 Z" fill="#FFFDE7" opacity="0.75"/>

  <!-- Tiny centre dot (scaled 80%) -->
  <circle cx="31" cy="23" r="1.76" fill="white" opacity="0.6"/>

  <!-- Small accent sparkle — top-right of bubble (scaled 80%) -->
  <path d="M45,7.2 L45.76,9.44 L48,10.4 L45.76,11.36 L45,13.6 L44.24,11.36 L42,10.4 L44.24,9.44 Z" fill="#FFD700" opacity="0.9"/>

  <!-- Tiny sparkle — top-left (scaled 80%) -->
  <path d="M13,7.2 L13.6,9.04 L15.6,9.8 L13.6,10.56 L13,12.4 L12.4,10.56 L10.4,9.8 L12.4,9.04 Z" fill="#FFD700" opacity="0.75"/>

  <!-- Micro dot right side (scaled 80%) -->
  <circle cx="48" cy="27" r="1.6" fill="#FFD700" opacity="0.55"/>

  <!-- Micro dot bottom (scaled 80%) -->
  <circle cx="38" cy="42" r="1.2" fill="#FFD700" opacity="0.45"/>
</svg>
