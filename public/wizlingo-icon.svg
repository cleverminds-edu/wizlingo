<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 62 62" fill="none">
  <defs>
    <!-- Bubble fill: hot pink top-right → vivid purple bottom-left -->
    <linearGradient id="wl-bubble" x1="31" y1="5" x2="-19" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F43F88"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>

    <!-- Star inner radial glow -->
    <radialGradient id="wl-star-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFDE7" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#FFD700" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Soft drop-shadow for the bubble -->
  <rect x="6" y="9" width="50" height="38" rx="13" fill="rgba(124,58,237,0.25)"/>

  <!-- Bubble body -->
  <rect x="3" y="5" width="50" height="38" rx="13" fill="url(#wl-bubble)"/>

  <!-- Bubble tail (lower-left, pointing downward) -->
  <path d="M 13,42 L 4,57 L 26,42 Z" fill="#7C3AED"/>

  <!-- Inner sparkle — glow halo -->
  <ellipse cx="28" cy="24" rx="13" ry="13" fill="url(#wl-star-glow)"/>

  <!-- 4-pointed sparkle star (centred at 28,24) outer R=10 inner R=3.8 -->
  <path d="M28,14 L31.0,21.0 L38,24 L31.0,27.0 L28,34 L25.0,27.0 L18,24 L25.0,21.0 Z" fill="#FFD700"/>

  <!-- Star inner bright highlight -->
  <path d="M28,18.5 L29.8,21.5 L33,23 L29.8,24.5 L28,27.5 L26.2,24.5 L23,23 L26.2,21.5 Z" fill="#FFFDE7" opacity="0.75"/>

  <!-- Tiny centre dot -->
  <circle cx="28" cy="24" r="2.2" fill="white" opacity="0.6"/>

  <!-- Small accent sparkle — top-right of bubble -->
  <path d="M49,6 L50.2,8.8 L53,10 L50.2,11.2 L49,14 L47.8,11.2 L45,10 L47.8,8.8 Z" fill="#FFD700" opacity="0.9"/>

  <!-- Tiny sparkle — top-left -->
  <path d="M6,7 L7,9.2 L9.2,10 L7,10.8 L6,13 L5,10.8 L2.8,10 L5,9.2 Z" fill="#FFD700" opacity="0.75"/>

  <!-- Micro dot right side -->
  <circle cx="54" cy="30" r="2" fill="#FFD700" opacity="0.55"/>

  <!-- Micro dot bottom -->
  <circle cx="40" cy="46" r="1.5" fill="#FFD700" opacity="0.45"/>
</svg>
