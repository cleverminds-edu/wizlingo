<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <!-- Define gradient for main circle -->
  <defs>
    <linearGradient id="wizardGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Main circle background -->
  <circle cx="100" cy="100" r="95" fill="url(#wizardGradient)" filter="url(#glow)"/>

  <!-- Magic wand - handle -->
  <rect x="70" y="45" width="8" height="50" fill="#8B7355" rx="4"/>

  <!-- Magic wand - star tip -->
  <g transform="translate(74, 38)">
    <polygon points="0,-8 2,-2 8,-1 3,3 5,9 0,6 -5,9 -3,3 -8,-1 -2,-2" fill="#FFD700" filter="url(#glow)"/>
  </g>

  <!-- Sparkles around wand -->
  <circle cx="110" cy="50" r="3" fill="#FFD700" opacity="0.8"/>
  <circle cx="120" cy="60" r="2.5" fill="#FFC107" opacity="0.7"/>
  <circle cx="85" cy="35" r="2" fill="#FFD700" opacity="0.9"/>

  <!-- Open book - left page -->
  <path d="M 60 100 Q 75 95 85 115 L 85 140 Q 75 135 60 140 Z" fill="#e8f4f8" stroke="#667eea" stroke-width="1.5"/>

  <!-- Open book - right page -->
  <path d="M 140 100 Q 125 95 115 115 L 115 140 Q 125 135 140 140 Z" fill="#f0f8ff" stroke="#667eea" stroke-width="1.5"/>

  <!-- Book spine -->
  <rect x="95" y="100" width="10" height="40" fill="#667eea"/>

  <!-- Lines on left page (text) -->
  <line x1="65" y1="110" x2="80" y2="110" stroke="#667eea" stroke-width="1" opacity="0.6"/>
  <line x1="65" y1="120" x2="78" y2="120" stroke="#667eea" stroke-width="1" opacity="0.6"/>
  <line x1="65" y1="130" x2="75" y2="130" stroke="#667eea" stroke-width="1" opacity="0.6"/>

  <!-- Lines on right page (text) -->
  <line x1="120" y1="110" x2="135" y2="110" stroke="#667eea" stroke-width="1" opacity="0.6"/>
  <line x1="120" y1="120" x2="135" y2="120" stroke="#667eea" stroke-width="1" opacity="0.6"/>
  <line x1="120" y1="130" x2="130" y2="130" stroke="#667eea" stroke-width="1" opacity="0.6"/>

  <!-- Decorative sparkles -->
  <circle cx="50" cy="80" r="2.5" fill="#FFD700" opacity="0.7"/>
  <circle cx="150" cy="85" r="2" fill="#FFC107" opacity="0.6"/>
  <circle cx="55" cy="155" r="1.8" fill="#FFD700" opacity="0.8"/>
  <circle cx="145" cy="150" r="2.2" fill="#FFC107" opacity="0.7"/>

  <!-- Outer accent ring -->
  <circle cx="100" cy="100" r="95" fill="none" stroke="#FFD700" stroke-width="2" opacity="0.3"/>
</svg>